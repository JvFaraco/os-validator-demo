<svg xmlns="http://www.w3.org/2000/svg" width="920" height="292" viewBox="0 0 920 292" role="img" aria-labelledby="titulo desc">
<title id="titulo">Três O.S. fictícias passando pelo validador</title>
<desc id="desc">Animação do fluxo: O.S. em JSON, contrato, 8 regras, catálogo, guarda de comando, sanitização, IA, validação e PRONTA_PARA_VALIDACAO. A OS-0007 percorre tudo e fica pronta com a combinação C13. A OS-0019 sai nas regras para PRECISA_CORRECAO, sem chamar a IA. A OS-0029 sai na guarda de comando para REVISAO_HUMANA, sem chamar a IA.</desc>
<style>
  .fundo { fill: #0d1117; }
  .borda { fill: none; stroke: #30363d; }
  .t { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Ubuntu, sans-serif; fill: #e6edf3; }
  .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
  .fraco { fill: #9198a1; }
  .no { fill: #161b22; stroke: #3d444d; stroke-width: 1.2; }
  .no-ia { fill: #0f2240; stroke: #79c0ff; stroke-width: 1.4; }
  .no-pronta { fill: #12261e; stroke: #7ee787; stroke-width: 1.4; }
  .no-correcao { fill: #2d1416; stroke: #ff7b72; stroke-width: 1.4; }
  .no-revisao { fill: #2b2111; stroke: #e3b341; stroke-width: 1.4; }
  .espinha { stroke: #56d4dd; stroke-width: 2; opacity: .55; }
  .saida { stroke-width: 1.4; stroke-dasharray: 4 4; fill: none; }
  .verde { fill: #7ee787; } .vermelho { fill: #ff7b72; } .amarelo { fill: #e3b341; } .azul { fill: #79c0ff; }

  /* Quadro parado: o que fica para quem prefere menos movimento */
  .ficha-a { transform: translate(860px, 90px); }
  .ficha-b { transform: translate(260px, 172px); }
  .ficha-c { transform: translate(460px, 172px); }
  .legenda { opacity: 0; }

  @media (prefers-reduced-motion: no-preference) {
    .estatica { opacity: 0; }
    .ficha-a { animation: ficha-a 12s linear infinite; }
    .ficha-b { animation: ficha-b 12s linear infinite; }
    .ficha-c { animation: ficha-c 12s linear infinite; }
    .legenda-a { animation: legenda-a 12s linear infinite; }
    .legenda-b { animation: legenda-b 12s linear infinite; }
    .legenda-c { animation: legenda-c 12s linear infinite; }
    .brilho-a { animation: brilho-a 12s ease-out infinite; }
    .brilho-b { animation: brilho-b 12s ease-out infinite; }
    .brilho-c { animation: brilho-c 12s ease-out infinite; }
    .passa-0 { animation: passa-0 12s linear infinite; }
    .passa-1 { animation: passa-1 12s linear infinite; }
    .passa-2 { animation: passa-2 12s linear infinite; }
    .passa-3 { animation: passa-3 12s linear infinite; }
    .passa-4 { animation: passa-4 12s linear infinite; }
    .passa-5 { animation: passa-5 12s linear infinite; }
    .passa-6 { animation: passa-6 12s linear infinite; }
    .passa-7 { animation: passa-7 12s linear infinite; }
  }
  .brilho { opacity: 1; }
  .passa { opacity: 0; fill: rgb(86 212 221 / .22); stroke: #56d4dd; stroke-width: 2.5; }
  @keyframes passa-0 { 0% { opacity: 1; } 2.4% { opacity: 0; } 32.7% { opacity: 0; } 33.3% { opacity: 1; } 35.7% { opacity: 0; } 66% { opacity: 0; } 66.6% { opacity: 1; } 69% { opacity: 0; } 100% { opacity: 0; } }
  @keyframes passa-1 { 0% { opacity: 0; } 2.15% { opacity: 0; } 2.75% { opacity: 1; } 5.15% { opacity: 0; } 37.05% { opacity: 0; } 37.65% { opacity: 1; } 40.05% { opacity: 0; } 68.85% { opacity: 0; } 69.45% { opacity: 1; } 71.85% { opacity: 0; } 100% { opacity: 0; } }
  @keyframes passa-2 { 0% { opacity: 0; } 4.9% { opacity: 0; } 5.5% { opacity: 1; } 7.9% { opacity: 0; } 41.4% { opacity: 0; } 42% { opacity: 1; } 44.4% { opacity: 0; } 71.7% { opacity: 0; } 72.3% { opacity: 1; } 74.7% { opacity: 0; } 100% { opacity: 0; } }
  @keyframes passa-3 { 0% { opacity: 0; } 7.65% { opacity: 0; } 8.25% { opacity: 1; } 10.65% { opacity: 0; } 74.55% { opacity: 0; } 75.15% { opacity: 1; } 77.55% { opacity: 0; } 100% { opacity: 0; } }
  @keyframes passa-4 { 0% { opacity: 0; } 10.4% { opacity: 0; } 11% { opacity: 1; } 13.4% { opacity: 0; } 77.4% { opacity: 0; } 78% { opacity: 1; } 80.4% { opacity: 0; } 100% { opacity: 0; } }
  @keyframes passa-5 { 0% { opacity: 0; } 13.15% { opacity: 0; } 13.75% { opacity: 1; } 16.15% { opacity: 0; } 100% { opacity: 0; } }
  @keyframes passa-6 { 0% { opacity: 0; } 15.9% { opacity: 0; } 16.5% { opacity: 1; } 18.9% { opacity: 0; } 100% { opacity: 0; } }
  @keyframes passa-7 { 0% { opacity: 0; } 18.65% { opacity: 0; } 19.25% { opacity: 1; } 21.65% { opacity: 0; } 100% { opacity: 0; } }

  @keyframes ficha-a {
    0% { transform: translate(60px, 90px); opacity: 0; }
    1.5% { opacity: 1; }
    22% { transform: translate(860px, 90px); }
    30% { transform: translate(860px, 90px); opacity: 1; }
    32%, 100% { transform: translate(860px, 90px); opacity: 0; }
  }
  @keyframes ficha-b {
    0%, 33.3% { transform: translate(60px, 90px); opacity: 0; }
    34.8% { opacity: 1; }
    42% { transform: translate(260px, 90px); }
    47% { transform: translate(260px, 172px); }
    63% { transform: translate(260px, 172px); opacity: 1; }
    65.5%, 100% { transform: translate(260px, 172px); opacity: 0; }
  }
  @keyframes ficha-c {
    0%, 66.6% { transform: translate(60px, 90px); opacity: 0; }
    68.1% { opacity: 1; }
    78% { transform: translate(460px, 90px); }
    83% { transform: translate(460px, 172px); }
    97% { transform: translate(460px, 172px); opacity: 1; }
    99.5%, 100% { transform: translate(460px, 172px); opacity: 0; }
  }
  @keyframes legenda-a { 0%, 1% { opacity: 0; } 4%, 30% { opacity: 1; } 32.5%, 100% { opacity: 0; } }
  @keyframes legenda-b { 0%, 34% { opacity: 0; } 37%, 63% { opacity: 1; } 65.8%, 100% { opacity: 0; } }
  @keyframes legenda-c { 0%, 67.5% { opacity: 0; } 70.5%, 97% { opacity: 1; } 99.6%, 100% { opacity: 0; } }
  @keyframes brilho-a { 0%, 21% { opacity: 0; } 23% { opacity: 1; } 32%, 100% { opacity: 0; } }
  @keyframes brilho-b { 0%, 46% { opacity: 0; } 48% { opacity: 1; } 65%, 100% { opacity: 0; } }
  @keyframes brilho-c { 0%, 82% { opacity: 0; } 84% { opacity: 1; } 99%, 100% { opacity: 0; } }
</style>
<defs>
  <filter id="halo" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="3.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect class="fundo" width="920" height="292" rx="12"/>
<rect class="borda" x=".5" y=".5" width="919" height="291" rx="11.5"/>

<text class="t fraco" x="20" y="34" font-size="13">Três O.S. fictícias passando pelo validador</text>
<text class="t azul" x="900" y="34" font-size="13" text-anchor="end" font-weight="600">abrir a demo interativa ↗</text>

<!-- espinha e saídas -->
<line class="espinha" x1="60" y1="90" x2="860" y2="90"/>
<path class="saida" stroke="#ff7b72" d="M260 110V172"/>
<path class="saida" stroke="#e3b341" d="M360 110V172M460 110V172M560 110V172M760 110V172"/>

<!-- as três O.S., por trás dos nós -->
<circle class="ficha-a verde" r="7" filter="url(#halo)"/>
<circle class="ficha-b vermelho" r="7" filter="url(#halo)"/>
<circle class="ficha-c amarelo" r="7" filter="url(#halo)"/>

<!-- nós -->
<g font-size="13" text-anchor="middle">
  <rect class="no" x="16" y="70" width="88" height="40" rx="8"/><text class="t" x="60" y="87" font-weight="600">O.S.</text><text class="t fraco m" x="60" y="102" font-size="11">JSON</text>
  <rect class="no" x="116" y="70" width="88" height="40" rx="8"/><text class="t" x="160" y="95" font-weight="600">Contrato</text>
  <rect class="no" x="216" y="70" width="88" height="40" rx="8"/><text class="t" x="260" y="87" font-weight="600">8 regras</text><text class="t fraco" x="260" y="102" font-size="11">em Python</text>
  <rect class="no" x="316" y="70" width="88" height="40" rx="8"/><text class="t" x="360" y="87" font-weight="600">Catálogo</text><text class="t fraco" x="360" y="102" font-size="11">fechado</text>
  <rect class="no" x="416" y="70" width="88" height="40" rx="8"/><text class="t" x="460" y="87" font-weight="600">Guarda</text><text class="t fraco" x="460" y="102" font-size="11">de comando</text>
  <rect class="no" x="516" y="70" width="88" height="40" rx="8"/><text class="t" x="560" y="95" font-weight="600">Sanitização</text>
  <rect class="no-ia" x="616" y="70" width="88" height="40" rx="8"/><text class="t azul" x="660" y="87" font-weight="700">IA</text><text class="t fraco" x="660" y="102" font-size="11">escolhe 1 opção</text>
  <rect class="no" x="716" y="70" width="88" height="40" rx="8"/><text class="t" x="760" y="87" font-weight="600">Validação</text><text class="t fraco" x="760" y="102" font-size="11">local</text>
  <rect class="no-pronta" x="816" y="70" width="88" height="40" rx="8"/><text class="t verde m" x="860" y="95" font-size="12" font-weight="700">PRONTA</text>
</g>

<!-- nó aceso quando uma O.S. passa -->
<rect class="passa passa-0" x="16" y="70" width="88" height="40" rx="8"/>
<rect class="passa passa-1" x="116" y="70" width="88" height="40" rx="8"/>
<rect class="passa passa-2" x="216" y="70" width="88" height="40" rx="8"/>
<rect class="passa passa-3" x="316" y="70" width="88" height="40" rx="8"/>
<rect class="passa passa-4" x="416" y="70" width="88" height="40" rx="8"/>
<rect class="passa passa-5" x="516" y="70" width="88" height="40" rx="8"/>
<rect class="passa passa-6" x="616" y="70" width="88" height="40" rx="8"/>
<rect class="passa passa-7" x="716" y="70" width="88" height="40" rx="8"/>

<!-- destinos das saídas -->
<g font-size="12" text-anchor="middle">
  <rect class="no-correcao" x="186" y="172" width="148" height="36" rx="8"/><text class="t vermelho m" x="260" y="194" font-weight="700">PRECISA_CORRECAO</text>
  <rect class="no-revisao" x="346" y="172" width="428" height="36" rx="8"/><text class="t amarelo m" x="560" y="194" font-weight="700">REVISAO_HUMANA</text>
</g>
<text class="t fraco" x="900" y="196" font-size="12" text-anchor="end">→ uma pessoa aprova</text>

<!-- brilho no destino de cada O.S. -->
<rect class="brilho brilho-a" x="816" y="70" width="88" height="40" rx="8" fill="none" stroke="#7ee787" stroke-width="3" filter="url(#halo)"/>
<rect class="brilho brilho-b" x="186" y="172" width="148" height="36" rx="8" fill="none" stroke="#ff7b72" stroke-width="3" filter="url(#halo)"/>
<rect class="brilho brilho-c" x="346" y="172" width="428" height="36" rx="8" fill="none" stroke="#e3b341" stroke-width="3" filter="url(#halo)"/>

<!-- legendas -->
<g font-size="13.5">
  <text class="t legenda legenda-a" x="20" y="252"><tspan class="m verde" font-weight="700">OS-0007</tspan>  nome e telefone do cliente viram [NOME] e [TELEFONE]; a IA escolhe C13 e o código aceita</text>
  <text class="t legenda legenda-b" x="20" y="252"><tspan class="m vermelho" font-weight="700">OS-0019</tspan>  sensor retirado sem devolução ao estoque: volta ao técnico, e a IA nem é chamada</text>
  <text class="t legenda legenda-c" x="20" y="252"><tspan class="m amarelo" font-weight="700">OS-0029</tspan>  a nota diz "ignore as regras": revisão humana, sem passar pela IA</text>
  <text class="t estatica" x="20" y="252"><tspan class="m verde" font-weight="700">OS-0007</tspan> pronta com C13 ·  <tspan class="m vermelho" font-weight="700">OS-0019</tspan> volta ao técnico ·  <tspan class="m amarelo" font-weight="700">OS-0029</tspan> vai para revisão</text>
  <text class="t fraco" x="20" y="274" font-size="12">Regras primeiro, IA só para ler a nota, decisão sempre do código. Dados 100% fictícios.</text>
</g>
</svg>
